{% extends "shop/base.html" %}
{% block title %}Поиск анкет{% endblock %}
{% block content %}
<section class="card">
  <h1>Поиск</h1>
  <form method="get" class="search-bar">
    <label>Пол
      <select name="gender">
        <option value="">Любой</option>
        <option value="2" {% if filters.gender == "2" %}selected{% endif %}>Женский</option>
        <option value="1" {% if filters.gender == "1" %}selected{% endif %}>Мужской</option>
      </select>
    </label>
    <label>Возраст от
      <input type="number" name="agefrom" value="{{ filters.agefrom }}" min="18" max="99" />
    </label>
    <label>до
      <input type="number" name="ageto" value="{{ filters.ageto }}" min="18" max="99" />
    </label>
    <label>Город
      <select name="city">
        <option value="">Все</option>
        {% for c in cities %}
        <option value="{{ c }}" {% if filters.city == c %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
      </select>
    </label>
    <button class="btn" type="submit">Найти</button>
  </form>
</section>
<p class="muted">Найдено: {{ ankets|length }}</p>
<div class="grid">
  {% for a in ankets %}
    {% include "shop/_anketa_card.html" %}
  {% empty %}
    <p class="muted">Никого не нашли — смягчите фильтры.</p>
  {% endfor %}
</div>
{% endblock %}
