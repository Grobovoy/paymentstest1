{% extends "shop/base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Регистрация</h1>
  <p class="muted">Создайте анкету — она появится в поиске. 18+</p>
  <form method="post" class="stack">
    {% csrf_token %}
    <label>Имя <input name="name" required placeholder="Как к вам обращаться" /></label>
    <label>Email <input type="email" name="email" required /></label>
    <label>Пароль <input type="password" name="password" required minlength="4" /></label>
    <label>Пол
      <select name="gender">
        <option value="2">Женский</option>
        <option value="1">Мужской</option>
      </select>
    </label>
    <label>Возраст <input type="number" name="age" min="18" max="99" value="25" required /></label>
    <label>Город
      <select name="city">
        {% for c in cities %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
      </select>
    </label>
    <label>Заголовок анкеты <input name="title" placeholder="Ищу общение" /></label>
    <label>О себе <textarea name="about" rows="3" placeholder="Коротко о себе"></textarea></label>
    <button class="btn" type="submit">Создать анкету</button>
  </form>
  <p class="muted" style="margin-top:12px">Уже есть аккаунт? <a href="/login/">Войти</a></p>
</section>
{% endblock %}
